spring.application.name=UberProject-AuthService

# URL of Database Server (Java uses JDBC server)
spring.datasource.url=jdbc:mysql://localhost:3306/Uber_DB_Local

# Username of Database Server
spring.datasource.username=root

# Password of Database Server
spring.datasource.password=SQL2026

#To see whatever queries are being executed set this as true, so you get it logged in your console also
spring.jpa.show-sql=true

#This is going to define that how the data will look like (ddl -> data definition language)
spring.jpa.hibernate.ddl-auto=validate

#To change the default port from 8080 to some other value
server.port=7474

#To enable Lazy Loading in Spring Data JPA
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

logging.level.org.springframework.data=DEBUG

